<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Top Face Crystal Gradient -->
    <linearGradient id="gemTopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Left Face Gradient -->
    <linearGradient id="gemLeftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Right Face Gradient -->
    <linearGradient id="gemRightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Neon Edge Glow -->
    <filter id="gemFullGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#4338CA" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#60A5FA" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#gemFullGlow)">
    <!-- 3D Isometric Crystal Cube / Gem with Beveled Glossy Faces -->
    <!-- Top Face -->
    <path d="M80 20 L132 48 L80 76 L28 48 Z" fill="url(#gemTopGrad)"/>

    <!-- Left Face -->
    <path d="M28 48 L80 76 L80 132 L28 104 Z" fill="url(#gemLeftGrad)"/>

    <!-- Right Face -->
    <path d="M80 76 L132 48 L132 104 L80 132 Z" fill="url(#gemRightGrad)"/>

    <!-- Inner Facet Bevel Highlights -->
    <path d="M80 24 L126 50 L80 72 L34 50 Z" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.75" fill="none"/>
    <line x1="80" y1="20" x2="80" y2="76" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.9"/>
    <line x1="28" y1="48" x2="80" y2="76" stroke="#93C5FD" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="80" y1="76" x2="132" y2="48" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85"/>
    <line x1="80" y1="76" x2="80" y2="132" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Specular Light Flares -->
    <circle cx="80" cy="22" r="4.5" fill="#FFFFFF"/>
    <circle cx="80" cy="76" r="5" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="60" cy="46" rx="14" ry="5" transform="rotate(-28 60 46)" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
