<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" fill="none">
  <rect width="500" height="620" rx="16" fill="#1C1917"/>
  <!-- Top header -->
  <text x="250" y="55" font-family="'Century Gothic', sans-serif" font-weight="900" font-size="14" fill="#F59E0B" letter-spacing="3" text-anchor="middle">CRISPY • SPICED • ROYAL</text>
  <text x="250" y="105" font-family="'Times New Roman', serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle">Moongdal</text>
  <text x="250" y="145" font-family="'Times New Roman', serif" font-style="italic" font-size="36" fill="#F59E0B" text-anchor="middle">Kachori</text>

  <!-- Golden Kachoris Visual -->
  <g transform="translate(250, 330)">
    <circle cx="0" cy="80" r="140" fill="#292524" opacity="0.6"/>
    <!-- Left Kachori -->
    <ellipse cx="-70" cy="40" rx="75" ry="65" fill="#D97706"/>
    <ellipse cx="-70" cy="35" rx="68" ry="58" fill="#F59E0B"/>
    <ellipse cx="-75" cy="30" rx="55" ry="45" fill="#FBBF24"/>
    <!-- Crack texture -->
    <path d="M-90 20 Q-70 30 -50 15" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right Kachori Broken Open with Spiced Lentil Filling -->
    <ellipse cx="65" cy="30" rx="75" ry="65" fill="#D97706"/>
    <ellipse cx="65" cy="25" rx="68" ry="58" fill="#F59E0B"/>
    <!-- Filling -->
    <ellipse cx="60" cy="15" rx="42" ry="32" fill="#78350F"/>
    <circle cx="50" cy="10" r="4" fill="#FDE68A"/><circle cx="70" cy="18" r="3" fill="#FDE68A"/>
    <!-- Chilis & Spices around -->
    <path d="M-130 100 Q-110 80 -100 110" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(250, 550)">
    <rect x="-120" y="-22" width="240" height="44" rx="22" fill="#F59E0B"/>
    <text y="6" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#000000" text-anchor="middle">TASTE AUTHENTIC CRUNCH</text>
  </g>
</svg>
