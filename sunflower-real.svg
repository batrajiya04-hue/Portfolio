<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Radial gradient for golden petals -->
    <linearGradient id="petalGradOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="petalGradInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="sunflowerDisk" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1C1008"/>
      <stop offset="45%" stop-color="#2D1505"/>
      <stop offset="75%" stop-color="#451A03"/>
      <stop offset="90%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <radialGradient id="diskRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="95%" stop-color="#D97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="petalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(200, 200)" filter="url(#petalShadow)">
    <!-- Layer 1: Back Petals (24 Petals) -->
    <g id="backPetals">
      <!-- 4 Base Petals spaced 90 deg -->
      <path d="M0 -30 C-18 -80 -14 -165 0 -185 C14 -165 18 -80 0 -30 Z" fill="url(#petalGradOuter)"/>
      <path d="M0 -30 C-18 -80 -14 -165 0 -185 C14 -165 18 -80 0 -30 Z" fill="url(#petalGradOuter)" transform="rotate(90)"/>
      <path d="M0 -30 C-18 -80 -14 -165 0 -185 C14 -165 18 -80 0 -30 Z" fill="url(#petalGradOuter)" transform="rotate(180)"/>
      <path d="M0 -30 C-18 -80 -14 -165 0 -185 C14 -165 18 -80 0 -30 Z" fill="url(#petalGradOuter)" transform="rotate(270)"/>
    </g>
    <use href="#backPetals" transform="rotate(15)"/>
    <use href="#backPetals" transform="rotate(30)"/>
    <use href="#backPetals" transform="rotate(45)"/>
    <use href="#backPetals" transform="rotate(60)"/>
    <use href="#backPetals" transform="rotate(75)"/>

    <!-- Layer 2: Front Overlapping Petals (Slightly shorter, brighter yellow, rotated 7.5 deg) -->
    <g id="frontPetals" transform="rotate(7.5)">
      <path d="M0 -25 C-15 -70 -12 -150 0 -170 C12 -150 15 -70 0 -25 Z" fill="url(#petalGradInner)"/>
      <path d="M0 -25 C-15 -70 -12 -150 0 -170 C12 -150 15 -70 0 -25 Z" fill="url(#petalGradInner)" transform="rotate(90)"/>
      <path d="M0 -25 C-15 -70 -12 -150 0 -170 C12 -150 15 -70 0 -25 Z" fill="url(#petalGradInner)" transform="rotate(180)"/>
      <path d="M0 -25 C-15 -70 -12 -150 0 -170 C12 -150 15 -70 0 -25 Z" fill="url(#petalGradInner)" transform="rotate(270)"/>
    </g>
    <use href="#frontPetals" transform="rotate(15)"/>
    <use href="#frontPetals" transform="rotate(30)"/>
    <use href="#frontPetals" transform="rotate(45)"/>
    <use href="#frontPetals" transform="rotate(60)"/>
    <use href="#frontPetals" transform="rotate(75)"/>

    <!-- Layer 3: Inner Floret Ring -->
    <circle cx="0" cy="0" r="68" fill="url(#sunflowerDisk)"/>
    <circle cx="0" cy="0" r="68" fill="url(#diskRim)"/>

    <!-- Seed Texture Dots in concentric spirals -->
    <g fill="#D97706" opacity="0.6">
      <circle cx="-12" cy="-15" r="3"/>
      <circle cx="15" cy="-10" r="3.2"/>
      <circle cx="-8" cy="18" r="3"/>
      <circle cx="20" cy="15" r="2.8"/>
      <circle cx="-25" cy="-5" r="3.4"/>
      <circle cx="2" cy="-28" r="3"/>
      <circle cx="-20" cy="25" r="3"/>
      <circle cx="10" cy="30" r="3.2"/>
      <circle cx="-35" cy="10" r="2.8"/>
      <circle cx="35" cy="-5" r="3"/>
      <circle cx="-5" cy="40" r="3"/>
      <circle cx="28" cy="-28" r="2.5"/>
      <circle cx="-28" cy="-28" r="2.5"/>
    </g>
    <!-- Center Core -->
    <circle cx="0" cy="0" r="22" fill="#1C1008"/>
    <circle cx="-4" cy="-4" r="3" fill="#D97706" opacity="0.7"/>
  </g>
</svg>
