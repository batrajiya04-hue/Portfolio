<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Inflatable Lilac Petal Gradient -->
    <radialGradient id="purplePetal" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="25%" stop-color="#D8B4FE"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="85%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#581C87"/>
    </radialGradient>

    <!-- 3D Puffy Center Yellow Button -->
    <radialGradient id="yellowButton" cx="38%" cy="32%" r="66%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="90%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </radialGradient>

    <filter id="flowerFullShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#9333EA" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#flowerFullShadow)">
    <g transform="translate(80, 80)">
      <!-- 5 Puffy 3D Petals arranged in circular arc with soft pillow overlaps -->
      <!-- Petal 1: Top (0 deg) -->
      <g transform="rotate(0)">
        <ellipse cx="0" cy="-38" rx="23" ry="25" fill="url(#purplePetal)"/>
        <ellipse cx="-4" cy="-44" rx="10" ry="6" fill="#FFFFFF" opacity="0.6"/>
      </g>

      <!-- Petal 2: Top-Right (72 deg) -->
      <g transform="rotate(72)">
        <ellipse cx="0" cy="-38" rx="23" ry="25" fill="url(#purplePetal)"/>
        <ellipse cx="-4" cy="-44" rx="10" ry="6" fill="#FFFFFF" opacity="0.55"/>
      </g>

      <!-- Petal 3: Bottom-Right (144 deg) -->
      <g transform="rotate(144)">
        <ellipse cx="0" cy="-38" rx="23" ry="25" fill="url(#purplePetal)"/>
        <ellipse cx="-4" cy="-44" rx="10" ry="6" fill="#FFFFFF" opacity="0.45"/>
      </g>

      <!-- Petal 4: Bottom-Left (216 deg) -->
      <g transform="rotate(216)">
        <ellipse cx="0" cy="-38" rx="23" ry="25" fill="url(#purplePetal)"/>
        <ellipse cx="-4" cy="-44" rx="10" ry="6" fill="#FFFFFF" opacity="0.5"/>
      </g>

      <!-- Petal 5: Top-Left (288 deg) -->
      <g transform="rotate(288)">
        <ellipse cx="0" cy="-38" rx="23" ry="25" fill="url(#purplePetal)"/>
        <ellipse cx="-4" cy="-44" rx="10" ry="6" fill="#FFFFFF" opacity="0.65"/>
      </g>

      <!-- Soft Petal Ambient Shadow behind center button -->
      <circle cx="0" cy="4" r="22" fill="#3B0764" opacity="0.5" filter="blur(3px)"/>

      <!-- Plump Spherical Center Yellow Button -->
      <circle cx="0" cy="0" r="19" fill="url(#yellowButton)"/>
      <ellipse cx="-5" cy="-6" rx="6" ry="4" transform="rotate(-30 -5 -6)" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="-3" cy="-4" r="2.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
