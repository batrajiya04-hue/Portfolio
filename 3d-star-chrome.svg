<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Multi-stop Liquid Chrome Gradient -->
    <radialGradient id="chromeBody" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#F1F5F9"/>
      <stop offset="38%" stop-color="#CBD5E1"/>
      <stop offset="60%" stop-color="#64748B"/>
      <stop offset="78%" stop-color="#334155"/>
      <stop offset="92%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#64748B"/>
    </radialGradient>

    <!-- Glossy Highlight Gradient -->
    <linearGradient id="chromeGlossTop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#E2E8F0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Chrome Rim Reflection -->
    <linearGradient id="chromeRim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F8FAFC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="chromeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#94A3B8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#chromeGlow)">
    <!-- Inflatable Puffy 4-Lobe Chrome Star -->
    <path d="M80 18 C88 44 98 62 128 70 C140 73 146 76 146 80 C146 84 140 87 128 90 C98 98 88 116 80 142 C76 148 72 148 68 142 C60 116 50 98 20 90 C8 87 2 84 2 80 C2 76 8 73 20 70 C50 62 60 44 68 18 C72 12 76 12 80 18 Z" 
          fill="url(#chromeBody)"/>

    <!-- Puffy Bevel Rim for Inflated Cushion Look -->
    <path d="M80 24 C87 47 96 64 124 72 C134 75 138 77 138 80 C138 83 134 85 124 88 C96 96 87 113 80 136 C77 140 73 140 70 136 C63 113 54 96 26 88 C16 85 12 83 12 80 C12 77 16 75 26 72 C54 64 63 47 70 24 C73 20 77 20 80 24 Z" 
          stroke="url(#chromeRim)" stroke-width="2.5" fill="none" opacity="0.85"/>

    <!-- Specular Highlight on Top Lobe -->
    <ellipse cx="75" cy="42" rx="7" ry="18" transform="rotate(-10 75 42)" fill="url(#chromeGlossTop)"/>
    <!-- Specular Highlight on Right Lobe -->
    <ellipse cx="112" cy="76" rx="16" ry="6" transform="rotate(-5 112 76)" fill="url(#chromeGlossTop)"/>
    <!-- Specular Highlight on Left Lobe -->
    <ellipse cx="38" cy="76" rx="14" ry="5" transform="rotate(8 38 76)" fill="url(#chromeGlossTop)"/>
    <!-- Central Puffy Gleam -->
    <circle cx="72" cy="72" r="14" fill="#FFFFFF" opacity="0.75" filter="blur(2px)"/>
    <circle cx="70" cy="70" r="6" fill="#FFFFFF"/>
  </g>
</svg>
