<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" fill="none">
  <defs>
    <linearGradient id="coffeeBg" x1="0" y1="0" x2="500" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
  </defs>
  <rect width="500" height="620" rx="16" fill="url(#coffeeBg)"/>
  
  <text x="250" y="55" font-family="'Century Gothic', sans-serif" font-weight="900" font-size="14" fill="#FBBF24" letter-spacing="4" text-anchor="middle">WARM DAYS</text>
  <text x="250" y="95" font-family="'Times New Roman', serif" font-weight="900" font-size="38" fill="#FFFFFF" text-anchor="middle">Golden Brews</text>
  <text x="250" y="125" font-family="'Times New Roman', serif" font-style="italic" font-size="20" fill="#D97706" text-anchor="middle">Artisanal Cold Brew & Creamy Foam</text>

  <!-- Two Cold Brew takeaway cups with ice and gradient milk swirl -->
  <g transform="translate(250, 330)">
    <!-- Cup 1 (Left) -->
    <g transform="translate(-55, 0)">
      <path d="M-45 -90 L45 -90 L32 100 C32 110 -32 110 -32 100 Z" fill="#78350F" stroke="#FDE68A" stroke-width="2"/>
      <!-- Cream swirl -->
      <path d="M-43 -40 Q0 0 43 -40 L44 -85 L-44 -85 Z" fill="#FEF3C7" opacity="0.85"/>
      <ellipse cx="0" cy="-90" rx="46" ry="12" fill="#FEF3C7"/>
      <!-- Straw -->
      <line x1="15" y1="-120" x2="-5" y2="60" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Cup 2 (Right, taller) -->
    <g transform="translate(55, 20)">
      <path d="M-40 -110 L40 -110 L28 90 C28 100 -28 100 -28 90 Z" fill="#92400E" stroke="#FDE68A" stroke-width="2"/>
      <path d="M-38 -55 Q0 -20 38 -55 L39 -105 L-39 -105 Z" fill="#FDF4DC" opacity="0.9"/>
      <ellipse cx="0" cy="-110" rx="42" ry="10" fill="#FDF4DC"/>
      <line x1="-12" y1="-135" x2="10" y2="40" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Coffee beans scattered -->
    <ellipse cx="-110" cy="95" rx="12" ry="8" fill="#B45309" transform="rotate(-30 -110 95)"/>
    <ellipse cx="115" cy="85" rx="14" ry="9" fill="#B45309" transform="rotate(25 115 85)"/>
  </g>

  <g transform="translate(250, 560)">
    <rect x="-100" y="-20" width="200" height="40" rx="20" fill="#F59E0B"/>
    <text y="6" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#000000" text-anchor="middle">SIP CHILLED</text>
  </g>
</svg>
