<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" fill="none">
  <rect width="500" height="620" rx="16" fill="#FDFBF7"/>
  <!-- Top branding -->
  <text x="250" y="45" font-family="'Brush Script MT', cursive, serif" font-size="28" fill="#8D6E63" text-anchor="middle">Authentic Flavours</text>
  <text x="250" y="90" font-family="'Times New Roman', serif" font-weight="900" font-size="44" fill="#2E7D32" text-anchor="middle">Khandvi</text>
  <text x="250" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#757575" letter-spacing="2" text-anchor="middle">TRADITIONAL GUJARATI DELICACY</text>

  <!-- Illustration of rolls with garnish -->
  <g transform="translate(250, 310)">
    <!-- Plate -->
    <ellipse cx="0" cy="90" rx="190" ry="70" fill="#E0E0E0" opacity="0.5"/>
    <ellipse cx="0" cy="80" rx="180" ry="60" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="4"/>
    
    <!-- Yellow Khandvi rolls -->
    <g transform="rotate(-15) translate(-60, 20)">
      <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#FFEB3B" stroke="#FBC02D" stroke-width="3"/>
      <!-- Mustard seeds -->
      <circle cx="-20" cy="-6" r="3" fill="#3E2723"/><circle cx="10" cy="5" r="2.5" fill="#3E2723"/><circle cx="30" cy="-4" r="3" fill="#3E2723"/>
    </g>
    <g transform="rotate(10) translate(50, 40)">
      <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#FFEE58" stroke="#FBC02D" stroke-width="3"/>
      <circle cx="-15" cy="4" r="3" fill="#3E2723"/><circle cx="15" cy="-5" r="2.5" fill="#3E2723"/>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#FFF176" stroke="#FBC02D" stroke-width="3"/>
      <!-- Green chili & coriander garnish -->
      <path d="M-40 -5 Q-10 -25 30 -5" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-10" cy="-2" r="3" fill="#3E2723"/><circle cx="20" cy="6" r="3" fill="#3E2723"/>
      <circle cx="-35" cy="2" r="2.5" fill="#3E2723"/>
    </g>
    <!-- Green Chutney bowl -->
    <ellipse cx="110" cy="100" rx="35" ry="22" fill="#2E7D32"/>
    <ellipse cx="110" cy="95" rx="32" ry="18" fill="#43A047"/>
  </g>

  <!-- Bottom CTA badge -->
  <g transform="translate(250, 560)">
    <rect x="-100" y="-20" width="200" height="40" rx="20" fill="#2E7D32"/>
    <text y="6" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">ORDER FRESH NOW</text>
  </g>
</svg>
