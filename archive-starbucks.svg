<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" fill="none">
  <rect width="500" height="620" rx="16" fill="#006241"/>
  
  <!-- Starbucks repeating typography: COFFEE COFFEE COFFEE -->
  <g transform="translate(60, 110)">
    <text font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" fill-opacity="0.15">COFFEE</text>
    <text y="55" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" fill-opacity="0.4">COFFEE</text>
    <text y="110" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">COFFEE</text>
  </g>

  <!-- Cup illustration with whipped cream and green straw -->
  <g transform="translate(250, 360)">
    <!-- Shadow -->
    <ellipse cx="0" cy="130" rx="90" ry="25" fill="#003523" opacity="0.4"/>
    
    <!-- Cup -->
    <path d="M-55 -70 L55 -70 L40 120 C40 130 -40 130 -40 120 Z" fill="#F4F1EA"/>
    
    <!-- Siren Logo emblem -->
    <circle cx="0" cy="20" r="32" fill="#006241"/>
    <circle cx="0" cy="20" r="28" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <polygon points="0,5 -3,15 -12,15 -5,22 -8,31 0,26 8,31 5,22 12,15 3,15" fill="#FFFFFF"/>
    
    <!-- Whipped cream dome -->
    <path d="M-55 -70 C-55 -110 -20 -130 0 -135 C20 -130 55 -110 55 -70 Z" fill="#FFFFFF"/>
    <path d="M-30 -90 Q0 -70 30 -90" stroke="#E5E7EB" stroke-width="4" fill="none"/>
    
    <!-- Caramel drizzle -->
    <path d="M-25 -95 Q0 -75 25 -105" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Green straw -->
    <line x1="12" y1="-170" x2="-8" y2="-70" stroke="#00754A" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(250, 560)">
    <rect x="-100" y="-20" width="200" height="40" rx="20" fill="#FFFFFF"/>
    <text y="6" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#006241" text-anchor="middle">SIP HAPPINESS</text>
  </g>
</svg>
