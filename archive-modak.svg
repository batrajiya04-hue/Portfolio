<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" fill="none">
  <rect width="500" height="620" rx="16" fill="#FFFBEB"/>
  <text x="250" y="55" font-family="'Century Gothic', sans-serif" font-weight="900" font-size="14" fill="#B45309" letter-spacing="3" text-anchor="middle">FESTIVE SWEET TRADITION</text>
  <text x="250" y="105" font-family="'Times New Roman', serif" font-weight="900" font-size="42" fill="#78350F" text-anchor="middle">Ukadiche</text>
  <text x="250" y="150" font-family="'Times New Roman', serif" font-size="48" font-weight="bold" fill="#D97706" text-anchor="middle">मोदक</text>

  <!-- Big golden steamed modak with saffron and kesar milk drizzle -->
  <g transform="translate(250, 340)">
    <!-- Banana leaf base plate -->
    <ellipse cx="0" cy="110" rx="190" ry="60" fill="#15803D"/>
    <path d="M-190 110 H190" stroke="#166534" stroke-width="2"/>
    
    <!-- Modak shape -->
    <path d="M0 -120 C40 -50 90 20 90 70 C90 110 50 120 0 120 C-50 120 -90 110 -90 70 C-90 20 -40 -50 0 -120 Z" fill="#FEF3C7" stroke="#FDE68A" stroke-width="3"/>
    <!-- Modak pleat ridges -->
    <path d="M0 -120 Q-30 0 -50 115" stroke="#FCD34D" stroke-width="2.5" fill="none"/>
    <path d="M0 -120 Q-10 10 -20 120" stroke="#FCD34D" stroke-width="2.5" fill="none"/>
    <path d="M0 -120 Q10 10 20 120" stroke="#FCD34D" stroke-width="2.5" fill="none"/>
    <path d="M0 -120 Q30 0 50 115" stroke="#FCD34D" stroke-width="2.5" fill="none"/>
    <!-- Kesar strands & ghee drip -->
    <line x1="0" y1="-120" x2="8" y2="-135" stroke="#DC2626" stroke-width="3"/>
    <line x1="0" y1="-120" x2="-6" y2="-132" stroke="#DC2626" stroke-width="3"/>
    <circle cx="5" cy="-70" r="4" fill="#F59E0B"/>
    <circle cx="-12" cy="-40" r="3" fill="#F59E0B"/>
  </g>

  <g transform="translate(250, 550)">
    <rect x="-100" y="-20" width="200" height="40" rx="20" fill="#B45309"/>
    <text y="6" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">AVAILABLE NOW</text>
  </g>
</svg>
