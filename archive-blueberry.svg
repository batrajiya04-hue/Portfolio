<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" fill="none">
  <defs>
    <linearGradient id="bbBg" x1="0" y1="0" x2="500" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="500" height="620" rx="16" fill="url(#bbBg)"/>
  
  <text x="250" y="60" font-family="'Century Gothic', sans-serif" font-weight="900" font-size="14" fill="#C4B5FD" letter-spacing="4" text-anchor="middle">CHILLED ARTISAN REFRESHMENT</text>
  <text x="250" y="110" font-family="'Didot', 'Times New Roman', serif" font-weight="900" font-size="46" fill="#FFFFFF" text-anchor="middle">Blueberry</text>
  <text x="250" y="150" font-family="'Didot', 'Times New Roman', serif" font-style="italic" font-size="38" fill="#A78BFA" text-anchor="middle">Basket</text>

  <!-- Highball cocktail glass with berries & mint -->
  <g transform="translate(250, 340)">
    <!-- Glass reflection -->
    <path d="M-50 -120 L50 -120 L35 110 C35 125 -35 125 -35 110 Z" fill="url(#glassGrad)" stroke="#C4B5FD" stroke-width="2"/>
    <!-- Drink liquid -->
    <path d="M-45 -70 L45 -70 L32 105 C32 115 -32 115 -32 105 Z" fill="#6D28D9" opacity="0.8"/>
    <!-- Ice cubes -->
    <rect x="-25" y="-30" width="30" height="30" rx="4" fill="#DDD6FE" opacity="0.6"/>
    <rect x="5" y="10" width="28" height="28" rx="4" fill="#DDD6FE" opacity="0.5"/>
    <!-- Straw -->
    <line x1="10" y1="-140" x2="-15" y2="90" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>
    <!-- Blueberries floating -->
    <circle cx="-15" cy="-45" r="14" fill="#312E81"/><circle cx="20" cy="-10" r="16" fill="#1E1B4B"/><circle cx="-5" cy="50" r="14" fill="#312E81"/>
    <circle cx="-75" cy="110" r="18" fill="#312E81"/><circle cx="65" cy="115" r="16" fill="#312E81"/>
    <!-- Mint leaf -->
    <path d="M-15 -125 Q-40 -150 -10 -155 Q0 -135 -15 -125 Z" fill="#10B981"/>
  </g>

  <!-- Bottom CTA badge -->
  <g transform="translate(250, 550)">
    <rect x="-100" y="-20" width="200" height="40" rx="20" fill="#8B5CF6"/>
    <text y="6" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">DISCOVER SIP</text>
  </g>
</svg>
