<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" fill="none">
  <rect width="500" height="620" rx="16" fill="#FFFBEB"/>
  
  <text x="250" y="55" font-family="'Century Gothic', sans-serif" font-weight="900" font-size="14" fill="#B45309" letter-spacing="3" text-anchor="middle">KHEDA'S ROYAL HERITAGE</text>
  <text x="250" y="105" font-family="'Times New Roman', serif" font-weight="900" font-size="42" fill="#78350F" text-anchor="middle">Halwasan</text>
  <text x="250" y="135" font-family="'Times New Roman', serif" font-style="italic" font-size="20" fill="#D97706" text-anchor="middle">Golden roasted wheat, pure ghee & nut crust</text>

  <!-- Visual of golden brown Halwasan sweets -->
  <g transform="translate(250, 330)">
    <!-- Base platter -->
    <ellipse cx="0" cy="80" rx="180" ry="60" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    
    <!-- Three round Halwasan sweets -->
    <!-- Left -->
    <ellipse cx="-70" cy="50" rx="55" ry="35" fill="#78350F" stroke="#92400E" stroke-width="3"/>
    <circle cx="-80" cy="45" r="4" fill="#FEF3C7"/><circle cx="-60" cy="52" r="3" fill="#FEF3C7"/>
    <!-- Right -->
    <ellipse cx="70" cy="50" rx="55" ry="35" fill="#78350F" stroke="#92400E" stroke-width="3"/>
    <circle cx="65" cy="45" r="4" fill="#FEF3C7"/><circle cx="85" cy="55" r="3" fill="#FEF3C7"/>
    <!-- Center elevated -->
    <ellipse cx="0" cy="15" rx="65" ry="42" fill="#854D0E" stroke="#A16207" stroke-width="4"/>
    <ellipse cx="0" cy="10" rx="58" ry="36" fill="#713F12"/>
    <!-- Pista and almond flakes -->
    <circle cx="-20" cy="5" r="5" fill="#84CC16"/>
    <circle cx="15" cy="12" r="4" fill="#84CC16"/>
    <circle cx="0" cy="0" r="5" fill="#FEF3C7"/>
    <circle cx="25" cy="-5" r="4" fill="#FEF3C7"/>
    <circle cx="-15" cy="18" r="4" fill="#FEF3C7"/>
  </g>

  <g transform="translate(250, 560)">
    <rect x="-100" y="-20" width="200" height="40" rx="20" fill="#78350F"/>
    <text y="6" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">TASTE ROYALTY</text>
  </g>
</svg>
